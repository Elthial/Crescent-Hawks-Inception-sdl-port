name: Linux Nix build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.5/install

      - name: Run asset-independent checks
        run: nix flake check --no-update-lock-file --print-build-logs

      - name: Build Linux launcher and runtime
        run: nix build --no-update-lock-file --print-build-logs
