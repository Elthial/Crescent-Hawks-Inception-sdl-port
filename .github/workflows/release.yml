name: Release Windows and Linux

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag (leave empty to dry-run the selected ref)'
        required: false
        type: string
      attach_assets:
        description: 'Attach to that published release after all checks pass'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-assets-${{ github.event.release.tag_name || inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      attach: ${{ steps.metadata.outputs.attach }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name && format('refs/tags/{0}', github.event.release.tag_name) || inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.sha }}
          persist-credentials: false
      - name: Validate release identity
        id: metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          ATTACH_ASSETS: ${{ github.event_name == 'release' || inputs.attach_assets }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "VERSION is not a semantic release number" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" && "$RELEASE_TAG" != "v$version" ]]; then
            echo "Release tag must match VERSION (v$version)" >&2
            exit 1
          fi
          if [[ "$ATTACH_ASSETS" == true && -z "$RELEASE_TAG" ]]; then
            echo "Attaching assets requires an existing release tag" >&2
            exit 1
          fi
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "version=$version"
            echo "tag=v$version"
            echo "attach=$ATTACH_ASSETS"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and test ${{ matrix.platform }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
          - platform: linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux SDL build dependencies
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev \
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libudev-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libpipewire-0.3-dev
      - name: Test release upload guards
        shell: pwsh
        run: python -m unittest discover -s tests -p test_release_assets.py -v
      - name: Build and test Release and Debug, then verify extracted package
        shell: pwsh
        run: ./tools/Build-ReleaseArtifact.ps1
      - name: Retain test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.platform }}
          path: |
            out/release-ci/*.xml
            out/release-ci/*/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
      - name: Retain tested archive
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: out/release-ci/dist/*
          if-no-files-found: error

  nix:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.28.5/install
      - name: Check and build the pinned Nix runtime
        run: |
          nix flake check --no-update-lock-file --print-build-logs
          nix build --no-update-lock-file --print-build-logs
          test "$(./result/bin/crescent-hawks-inception --version)" = "CrescentHawksInception $RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}

  bundle:
    needs: [prepare, build, nix]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: out/release-bundle
      - uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: out/release-bundle
      - name: Require both archives and write their checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python3 tools/release_assets.py manifest \
            --directory out/release-bundle --version "$RELEASE_VERSION"
          (cd out/release-bundle && sha256sum --check ./*-SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: out/release-bundle/*
          if-no-files-found: error

  attach:
    needs: [prepare, bundle]
    if: needs.prepare.outputs.attach == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-bundle
          path: out/release-bundle
      - name: Attach verified archives to the matching release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          python3 tools/release_assets.py publish \
            --directory out/release-bundle --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT"
